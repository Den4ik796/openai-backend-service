<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #343541; color: #ececf1; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: #202123; display: flex; flex-direction: column; border-right: 1px solid #4d4d4f; }
        .sidebar-header { padding: 10px; }
        .new-chat-btn { width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.9rem; transition: 0.2s; }
        .new-chat-btn:hover { background: rgba(255,255,255,0.1); }
        .sessions-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .session-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; color: #ececf1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-item:hover { background: rgba(255,255,255,0.05); }
        .session-item.active { background: #343541; font-weight: bold; }

        /* Main Chat Area */
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: #343541; }
        .header { padding: 12px 20px; border-bottom: 1px solid #4d4d4f; display: flex; justify-content: flex-end; align-items: center; background: #343541; gap: 10px; }
        .model-select { background: #40414f; color: white; border: 1px solid #565869; padding: 6px 10px; border-radius: 6px; outline: none; }
        .reset-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .reset-btn:hover { background: #c82333; }
        
        .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .message-row { display: flex; justify-content: center; padding: 24px 20px; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .message-row.assistant { background-color: #444654; }
        .message-content { max-width: 750px; width: 100%; display: flex; gap: 20px; line-height: 1.6; }
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .avatar.user { background-color: #5436da; }
        .avatar.assistant { background-color: #10a37f; }
        .text { flex: 1; white-space: pre-wrap; }
        
        .input-container { padding: 20px; display: flex; justify-content: center; background-image: linear-gradient(180deg, rgba(53,55,64,0), #353740 58.85%); }
        .input-box { max-width: 750px; width: 100%; display: flex; background: #40414f; border-radius: 12px; padding: 10px 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.1); gap: 10px; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: white; font-size: 1rem; outline: none; padding: 5px; }
        button.send { background: #10a37f; color: white; border: none; border-radius: 6px; padding: 5px 15px; cursor: pointer; transition: 0.2s; }
        button.send:hover { background: #0b8c6c; }
        button:disabled { background: #555; cursor: not-allowed; }
        .typing { opacity: 0.5; font-style: italic; }
        .no-session { display: flex; flex: 1; align-items: center; justify-content: center; color: #8e8ea0; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewSession()">+ Новий чат</button>
        </div>
        <div class="sessions-list" id="sessionsList"></div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="header">
            <select id="modelSelect" class="model-select">
                <option value="gpt-4o-mini">gpt-4o-mini</option>
                <option value="gpt-4o">gpt-4o</option>
                <option value="gpt-4">gpt-4</option>
            </select>
            <button class="reset-btn" onclick="resetSession()">Reset</button>
        </div>

        <div class="chat-container" id="messagesContainer">
            <div class="no-session" id="noSessionText">Оберіть або створіть чат</div>
        </div>

        <div class="input-container" id="inputContainer" style="display: none;">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Надіслати повідомлення..." autocomplete="off">
                <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        let sessionsCache = [];

        const messagesContainer = document.getElementById('messagesContainer');
        const sessionsList = document.getElementById('sessionsList');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const inputContainer = document.getElementById('inputContainer');
        const noSessionText = document.getElementById('noSessionText');
        const modelSelect = document.getElementById('modelSelect');

        async function loadSessions() {
            try {
                const res = await fetch('/sessions');
                sessionsCache = await res.json();
                renderSessionsList();
            } catch (e) {
                console.error("Помилка завантаження сесій", e);
            }
        }

        function renderSessionsList() {
            sessionsList.innerHTML = '';
            sessionsCache.forEach((s, index) => {
                const div = document.createElement('div');
                div.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
                div.innerText = `Сесія #${index + 1}`;
                div.onclick = () => selectSession(s.id);
                sessionsList.appendChild(div);
            });
        }

        async function createNewSession() {
            try {
                const res = await fetch('/sessions', { method: 'POST' });
                const data = await res.json();
                await loadSessions();
                selectSession(data.id);
            } catch (e) {
                alert("Помилка створення сесії");
            }
        }

        async function selectSession(sessionId) {
            currentSessionId = sessionId;
            renderSessionsList();
            inputContainer.style.display = 'flex';
            
            try {
                const res = await fetch(`/sessions/${sessionId}`);
                const data = await res.json();
                messagesContainer.innerHTML = '';
                
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        appendMessageDOM(msg.role, msg.content);
                    });
                } else {
                    appendMessageDOM('assistant', 'Початок нової сесії. Напишіть перше повідомлення!');
                }
            } catch (e) {
                messagesContainer.innerHTML = '<div class="no-session">Помилка завантаження історії</div>';
            }
        }

        async function resetSession() {
            if (!currentSessionId) return;
            try {
                const res = await fetch(`/sessions/${currentSessionId}/reset`, { method: 'POST' });
                if (res.ok) {
                    messagesContainer.innerHTML = '';
                    appendMessageDOM('assistant', 'Контекст сесії очищено. Починаємо з чистого аркуша!');
                } else {
                    alert("Помилка ресету");
                }
            } catch (e) {
                alert("Помилка мережі");
            }
        }

        function appendMessageDOM(role, text, isTyping = false) {
            if (noSessionText) noSessionText.style.display = 'none';

            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            row.id = isTyping ? 'typing-indicator' : '';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.innerText = role === 'user' ? 'U' : 'AI';
            
            const textDiv = document.createElement('div');
            textDiv.className = `text ${isTyping ? 'typing' : ''}`;
            textDiv.innerText = text;
            
            content.appendChild(avatar);
            content.appendChild(textDiv);
            row.appendChild(content);
            messagesContainer.appendChild(row);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !currentSessionId) return;

            const selectedModel = modelSelect.value;
            appendMessageDOM("user", text);
            userInput.value = '';
            sendBtn.disabled = true;
            appendMessageDOM("assistant", "Модель генерує відповідь...", true);

            try {
                const res = await fetch(`/sessions/${currentSessionId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text, model: selectedModel })
                });
                const data = await res.json();
                
                document.getElementById('typing-indicator').remove();
                
                if (res.ok) {
                    appendMessageDOM("assistant", data.content);
                } else {
                    let errMsg = data.detail ? JSON.stringify(data.detail) : "Невідома помилка";
                    appendMessageDOM("assistant", `Помилка API: ${errMsg}`);
                }
            } catch (e) {
                document.getElementById('typing-indicator').remove();
                appendMessageDOM("assistant", "Помилка мережі.");
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        loadSessions();
    </script>
</body>
</html>
