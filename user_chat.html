<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #343541; color: #ececf1; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: #202123; display: flex; flex-direction: column; padding: 10px; flex-shrink: 0; }
        .new-chat-btn { background: transparent; border: 1px solid #4d4d4f; color: white; border-radius: 6px; padding: 12px; text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; font-size: 14px; gap: 10px; }
        .new-chat-btn:hover { background: #2A2B32; }
        .session-list { flex: 1; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 5px; }
        .session-item { padding: 10px; border-radius: 6px; cursor: pointer; color: #ececf1; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .session-item:hover { background: #2A2B32; }
        .session-item.active { background: #343541; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #343541; position: relative; }
        .header { padding: 15px 20px; text-align: center; border-bottom: 1px solid #4d4d4f; font-weight: 600; font-size: 1.1rem; }
        .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 20px; }
        .message-row { display: flex; justify-content: center; padding: 24px 20px; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .message-row.assistant { background-color: #444654; }
        .message-content { max-width: 750px; width: 100%; display: flex; gap: 20px; line-height: 1.6; }
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .avatar.user { background-color: #5436da; }
        .avatar.assistant { background-color: #10a37f; }
        .text { flex: 1; white-space: pre-wrap; }
        .input-container { padding: 20px; display: flex; justify-content: center; background-image: linear-gradient(180deg, rgba(53,55,64,0), #353740 58.85%); }
        .input-box { max-width: 750px; width: 100%; display: flex; background: #40414f; border-radius: 12px; padding: 10px 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.1); }
        input[type="text"] { flex: 1; background: transparent; border: none; color: white; font-size: 1rem; outline: none; padding: 5px; }
        button.send-btn { background: #10a37f; color: white; border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        button.send-btn:hover { background: #0b8c6c; }
        button.send-btn:disabled { background: #555; cursor: not-allowed; }
        .typing { opacity: 0.5; font-style: italic; }
        .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="new-chat-btn" onclick="startNewSession()">+ Новий чат</button>
        <div class="session-list" id="sessionList"></div>
    </div>
    <div class="chat-area">
        <div class="header" id="chatHeader">Оберіть або створіть чат</div>
        <div class="chat-container" id="messages">
            <div class="empty-state">
                <h2>AI Assistant Backend</h2>
                <p>Створіть нову сесію, щоб почати</p>
            </div>
        </div>
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Надіслати повідомлення..." autocomplete="off" disabled>
                <button id="sendBtn" class="send-btn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sessionList = document.getElementById('sessionList');
        const chatHeader = document.getElementById('chatHeader');

        async function loadSessions() {
            try {
                const res = await fetch('/sessions');
                const sessions = await res.json();
                sessionList.innerHTML = '';
                
                sessions.reverse().forEach(s => {
                    const item = document.createElement('div');
                    item.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
                    item.innerText = `💬 Сесія #${s.id}`;
                    item.onclick = () => loadSessionHistory(s.id);
                    sessionList.appendChild(item);
                });
            } catch (e) {
                console.error('Failed to load sessions', e);
            }
        }

        async function startNewSession() {
            try {
                const res = await fetch('/sessions', { method: 'POST' });
                const data = await res.json();
                await loadSessionHistory(data.id);
                loadSessions();
            } catch (e) {
                console.error('Failed to start new session', e);
            }
        }

        async function loadSessionHistory(id) {
            currentSessionId = id;
            chatHeader.innerText = `Чат #${id}`;
            userInput.disabled = false;
            sendBtn.disabled = false;
            messagesDiv.innerHTML = '';
            
            try {
                const res = await fetch(`/sessions/${id}`);
                const data = await res.json();
                
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        addMessage(msg.role, msg.content, false);
                    });
                } else {
                    messagesDiv.innerHTML = '<div class="empty-state"><p>Це початок вашого спілкування.</p></div>';
                }
                loadSessions();
            } catch (e) {
                console.error('Failed to load history', e);
            }
        }

        function addMessage(role, text, isTyping = false) {
            const empty = document.querySelector('.empty-state');
            if(empty) empty.remove();

            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            if(isTyping) row.id = 'typing-indicator';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.innerText = role === 'user' ? 'U' : 'AI';
            
            const textDiv = document.createElement('div');
            textDiv.className = `text ${isTyping ? 'typing' : ''}`;
            textDiv.innerText = text;
            
            content.appendChild(avatar);
            content.appendChild(textDiv);
            row.appendChild(content);
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !currentSessionId) return;

            addMessage("user", text);
            userInput.value = '';
            sendBtn.disabled = true;
            addMessage("assistant", "Модель генерує відповідь...", true);

            try {
                const res = await fetch(`/sessions/${currentSessionId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });
                const data = await res.json();
                
                const typing = document.getElementById('typing-indicator');
                if(typing) typing.remove();
                
                if (res.ok) {
                    addMessage("assistant", data.content);
                } else {
                    addMessage("assistant", `Помилка API: ${JSON.stringify(data.detail)}`);
                }
            } catch (e) {
                const typing = document.getElementById('typing-indicator');
                if(typing) typing.remove();
                addMessage("assistant", "Помилка мережі.");
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Init
        loadSessions();
    </script>
</body>
</html>
