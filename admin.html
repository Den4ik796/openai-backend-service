<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 40px; color: #333; }
        h1 { margin-top: 0; color: #2c3e50; margin-bottom: 0; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-api { background-color: #2c3e50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        .btn-api:hover { background-color: #1a252f; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid #e9ecef; }
        th { background-color: #f1f3f5; font-weight: 600; color: #495057; }
        tr:hover { background-color: #f8f9fa; }
        .badge { background: #e3f2fd; color: #0d47a1; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .cost { color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1>Панель адміністратора</h1>
        <a href="/docs" target="_blank" class="btn-api">⚙️ Відкрити API (Swagger)</a>
    </div>
    <div class="card">
        <h2>Історія сесій</h2>
        <table>
            <thead>
                <tr>
                    <th>ID сесії</th>
                    <th>Дата створення</th>
                    <th>Витрачено токенів</th>
                    <th>Загальна вартість</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4">Завантаження...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadSessions() {
            try {
                const res = await fetch('/sessions');
                const sessions = await res.json();
                
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                
                if(sessions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Немає жодної сесії.</td></tr>';
                    return;
                }

                sessions.forEach(s => {
                    const date = new Date(s.created_at).toLocaleString();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>#${s.id}</strong></td>
                        <td>${date}</td>
                        <td><span class="badge">${s.total_tokens}</span></td>
                        <td class="cost">$${s.total_cost.toFixed(6)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="4">Помилка завантаження даних.</td></tr>';
            }
        }

        loadSessions();
        setInterval(loadSessions, 5000);
    </script>
</body>
</html>
